<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Livingood Wellness Center</title>
  <defs>
    <linearGradient id="lw" gradientUnits="userSpaceOnUse" x1="5" y1="12" x2="31" y2="31">
      <stop offset="0" stop-color="#A63F2A"/>
      <stop offset="0.07" stop-color="#E2743A"/>
      <stop offset="0.2" stop-color="#F0C346"/>
      <stop offset="0.36" stop-color="#B9D24C"/>
      <stop offset="0.52" stop-color="#6DBE5E"/>
      <stop offset="0.68" stop-color="#8ED2C4"/>
      <stop offset="0.84" stop-color="#4E9EDC"/>
      <stop offset="1" stop-color="#2F6CC4"/>
    </linearGradient>
    <linearGradient id="lh" gradientUnits="userSpaceOnUse" x1="20" y1="31" x2="20" y2="51">
      <stop offset="0" stop-color="#4E9EDC" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#3F86D4" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#2F6CC4"/>
      <stop offset="0.8" stop-color="#2A4EB2"/>
      <stop offset="1" stop-color="#1D3585"/>
    </linearGradient>
    <linearGradient id="rw" gradientUnits="userSpaceOnUse" x1="59" y1="12" x2="33" y2="31">
      <stop offset="0" stop-color="#2E97A6"/>
      <stop offset="0.2" stop-color="#5CC6D2"/>
      <stop offset="0.45" stop-color="#84D9E2"/>
      <stop offset="0.75" stop-color="#3F8ED4"/>
      <stop offset="1" stop-color="#2F6CC4"/>
    </linearGradient>
    <linearGradient id="rh" gradientUnits="userSpaceOnUse" x1="44" y1="32" x2="44" y2="51">
      <stop offset="0" stop-color="#9AA0DE" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#9AA0DE" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#9C4FB3"/>
      <stop offset="0.65" stop-color="#C2207F"/>
      <stop offset="0.88" stop-color="#A5125E"/>
      <stop offset="1" stop-color="#77204B"/>
    </linearGradient>
    <radialGradient id="edge" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0.6" stop-color="#0B1440" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1440" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="spot">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- wing silhouettes, one continuous shape per side with scalloped margins -->
    <path id="ls" d="M31.5 27.5 C26 20.5 14 12.5 3.5 11 Q1.8 12.5 2.5 15.5 Q1.5 17.4 3 20.5 Q2.4 22.6 4.5 25.5 Q4.1 27.3 6.5 29.5 Q6.4 31.2 9 33 C9.3 34 8.4 34.7 7.8 35.5 Q6.4 38.5 7.7 40.8 Q7.2 43.6 9.2 45.2 Q9.4 47.9 12 48.8 Q12.9 51 15.7 51.2 Q17 52.7 20 52 Q21.3 52.9 23.9 51.3 L31.5 40 Z"/>
    <path id="rs" d="M32.5 27.5 C38 20.5 50 12.5 60.5 11 Q62.2 12.5 61.5 15.5 Q62.5 17.4 61 20.5 Q61.6 22.6 59.5 25.5 Q59.9 27.3 57.5 29.5 Q57.6 31.2 55 33 C54.7 34 55.6 34.7 56.2 35.5 Q57.6 38.5 56.3 40.8 Q56.8 43.6 54.8 45.2 Q54.6 47.9 52 48.8 Q51.1 51 48.3 51.2 Q47 52.7 44 52 Q42.7 52.9 40.1 51.3 L32.5 40 Z"/>
  </defs>
  <circle cx="32" cy="32" r="32" fill="#E8EBB2"/>
  <g transform="translate(32 32) scale(0.88) translate(-32 -32)">
    <g transform="rotate(30 32 32) translate(32 32) scale(0.87) translate(-32 -32)">
      <!-- forewing colour along each wing -->
      <use href="#ls" fill="url(#lw)"/>
      <use href="#rs" fill="url(#rw)"/>
      <!-- hindwing colour, fading in below the forewing so there is no seam -->
      <use href="#ls" fill="url(#lh)"/>
      <use href="#rs" fill="url(#rh)"/>
      <!-- pooled watercolour edges -->
      <use href="#ls" fill="url(#edge)"/>
      <use href="#rs" fill="url(#edge)"/>
      <!-- lighter patches -->
      <g fill="url(#spot)">
        <ellipse cx="17" cy="25" rx="5.5" ry="3.2"/>
        <ellipse cx="16" cy="41" rx="4" ry="2.6"/>
        <ellipse cx="50" cy="21" rx="4.5" ry="2.8"/>
        <ellipse cx="47" cy="29" rx="3" ry="2"/>
        <ellipse cx="41" cy="42" rx="3.4" ry="2.2"/>
      </g>
      <!-- thin black outline, ridged by the scalloped margins -->
      <use href="#ls" fill="none" stroke="#161626" stroke-width="0.6" stroke-linejoin="round"/>
      <use href="#rs" fill="none" stroke="#161626" stroke-width="0.6" stroke-linejoin="round"/>
      <!-- body -->
      <g stroke="#164E3E" stroke-linecap="round" fill="none">
        <path d="M31.3 25c-1.8-3-4.2-6-7.3-8.2M32.7 25c1.8-3 4.2-6 7.3-8.2" stroke-width="0.8"/>
        <line x1="32" y1="27" x2="32" y2="45" stroke-width="2"/>
      </g>
      <circle cx="32" cy="26" r="1.6" fill="#164E3E"/>
    </g>
  </g>
</svg>
