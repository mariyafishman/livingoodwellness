  <circle cx="32" cy="32" r="32" fill="#E8EBB2"/>
  <g transform="translate(32 32) scale(0.84) translate(-33 -32.5)">
    <!-- hindwings -->
    <path id="lhw" d="M28 34c-8-5-20-7-24-3-3 5-1 12 4 15.5 5 2 12-.5 15.5-4.5 2.5-3 4-5.5 4.5-8Z" fill="url(#lh)"/>
    <path id="rhw" d="M25 36c6.5 2 14 5.5 18.5 10.5 3 4.5 1 10-4 13-5 2-11.5.5-13.5-4.5-2-5-2.5-14-1-19Z" fill="url(#rh)"/>
    <!-- forewings, overlapping the hindwings at the body -->
    <path id="lfw" d="M29 32c-2-5-5-16-8.5-24.5-1-2.5-4.5-3.5-7-2-3 2-4 8.5-5 15.5-1 6-1.5 12 1.5 15 5 3 14 1 19-4Z" fill="url(#lf)"/>
    <path id="rfw" d="M31.5 31c6.5-3 16.5-6 24.5-5.5 4 .5 7 2 6 4.5-1.5 4-7 10.5-14 13-6 1-12-2-16-5Z" fill="url(#rf)"/>
    <!-- pooled watercolour edges -->
    <g fill="url(#edge)">
      <use href="#lhw"/><use href="#rhw"/><use href="#lfw"/><use href="#rfw"/>
    </g>
    <!-- lighter patches -->
    <g fill="url(#spot)">
      <ellipse cx="57" cy="35" rx="3.2" ry="2.2"/>
      <ellipse cx="51" cy="40" rx="2.8" ry="2"/>
      <ellipse cx="14" cy="26" rx="5" ry="3.4"/>
      <ellipse cx="45" cy="32" rx="3.4" ry="2.2"/>
      <ellipse cx="12" cy="38" rx="3" ry="2.2"/>
    </g>
    <path d="M19.6 6.8c1 1.6 1.7 3.4 2.3 5.6" stroke="#C0407A" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <g fill="#3A1030" opacity="0.45">
      <circle cx="33" cy="59" r="0.7"/><circle cx="37.5" cy="58.6" r="0.7"/><circle cx="42" cy="54.5" r="0.7"/>
    </g>
    <!-- body -->
    <g stroke="#164E3E" stroke-linecap="round" fill="none">
      <path d="M30.5 29.5c-.5-3.2-.9-6.8-1.3-10.2M31.8 29.6c3.4-1.5 7.2-3 10.8-4.4" stroke-width="0.7"/>
      <line x1="31" y1="30.6" x2="22.8" y2="47" stroke-width="1.6"/>
    </g>
    <circle cx="31.2" cy="30" r="1.35" fill="#164E3E"/>
  </g>
</svg>
